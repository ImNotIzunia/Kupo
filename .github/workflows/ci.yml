name: Kupo CI

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests & static analysis
    runs-on: ubuntu-latest

    timeout-minutes: 10

    steps:
      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v5

      # --------------------------------------------------------
      # Install dependencies
      # --------------------------------------------------------

      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            bats \
            jq \
            shellcheck

      # --------------------------------------------------------
      # Verify tools
      # --------------------------------------------------------

      - name: Check tool versions
        run: |
          echo "Bash:"
          bash --version | head -n 1

          echo
          echo "Bats:"
          bats --version

          echo
          echo "jq:"
          jq --version

          echo
          echo "ShellCheck:"
          shellcheck --version

      # --------------------------------------------------------
      # Prepare test runner
      # --------------------------------------------------------

      - name: Prepare test runner
        run: chmod +x tests/run.sh

      # --------------------------------------------------------
      # Run all checks
      # --------------------------------------------------------

      - name: Run tests and static analysis
        run: ./tests/run.sh